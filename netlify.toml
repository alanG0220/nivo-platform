# Configuración de despliegue en Netlify para Nivo (SPA con React Router)
[build]
  command = "npm run build"
  publish = "dist"

# Redirige todas las rutas al index.html para que React Router maneje el enrutamiento del lado del cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
